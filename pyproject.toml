[project]
name = "polymarket-alternative-data"
version = "0.1.0"
description = "Historical CSI 300 Alpha158 and LightGBM research baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare==1.19.1",
  "baostock==0.9.4",
  "pyqlib==0.9.7",
  "lightgbm==4.7.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "PyYAML>=6",
  "psutil>=6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
