[project]
name = "polymarket-alternative-data"
version = "0.1.0"
description = "Qlib Alpha158 MLP baseline and Polymarket oil factor extension"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare==1.19.1",
  "baostock==0.9.4",
  "pyqlib==0.9.7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "PyYAML>=6",
  "psutil>=6",
  "polymarket-client==0.13.0",
  "torch>=2.6,<3",
  "pandas-market-calendars==5.4.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
